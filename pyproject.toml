[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-herald"
dynamic = ["version"]
description = "Django library for separating the message content from transmission method"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Worthwhile", email = "devs@worthwhile.com"}
]
keywords = ["django", "notifications", "messaging"]
classifiers = [
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "django>=4.2",
    "jsonpickle",
]

[project.urls]
"Homepage" = "https://github.com/worthwhile/django-herald/"
"Download" = "https://github.com/worthwhile/django-herald/tarball/"

[project.optional-dependencies]
twilio = ["twilio"]
html2text = ["html2text"]

[tool.hatch.version]
path = "herald/_version.py"

[tool.hatch.build]
include = [
    "herald/**/*.py",
    "herald/templates/**/*",
    "herald/contrib/auth/templates/**/*",
    "LICENSE",
]

[tool.coverage.paths]
source = ["herald"]

[tool.coverage.run]
branch = true
omit = ["*/migrations/*"]
data_file = ".coverage-data/.coverage"

[tool.ruff]
line-length = 98
target-version = "py38"
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".nox",
    ".venv",
    "dist",
    "migrations",
]

[tool.ruff.lint]
# Select specific rule sets
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N",  # pep8-naming
    "COM", # flake8-commas
    "RET", # return statements
    "SIM", # simplifications
]
ignore = [
    "E501",  # line length - handled by formatter
    "COM812", # trailing comma - conflicts with formatter
]

[tool.ruff.lint.isort]
known-first-party = ["herald"]
known-third-party = ["django", "jsonpickle", "twilio", "html2text"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["N806"]  # Ignore variable capitalization in test files

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[dependency-groups]
dev = [
    "pytz>=2025.2",
    "twilio>=6.0.0",
    "html2text>=2019.8.11",
    "coveralls>=4.0.1",
    "ruff>=0.11.2",
]
